<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>For You 💕</title>
    <meta name="description" content="A love letter written in the stars">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@400;700&family=Outfit:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Sparkle canvas behind everything -->
    <canvas id="sparkles"></canvas>

    <!-- Parallax scene that follows cursor -->
    <div id="scene">
        <!-- Center message overlay -->
        <div id="center-message">
            <span class="msg-line">I Love You</span>
            <span class="msg-sub">— forever & always —</span>
        </div>
    </div>

    <!-- Vignette overlay for depth -->
    <div id="vignette"></div>

    <!-- Custom Cursor -->
    <div id="custom-cursor"></div>

    <script src="script.js"></script>
</body>
</html>
